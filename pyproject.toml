[project]
name = "ha-local-delta"
# Placeholder, never bumped: the version of record is
# custom_components/local_delta/manifest.json.
version = "0.0.0"
description = "Home Assistant integration for a Delta VoiceIQ faucet on a local MQTT broker"
requires-python = ">=3.14.2,<3.15"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "homeassistant==2026.8.3",
  "pytest-homeassistant-custom-component==0.13.357",
  "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.per-file-target-version]
# The setup script runs on users' own computers; keep it to Python 3.9 syntax.
"scripts/**" = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"scripts/**" = ["E501"]  # long user-facing prose

[tool.mypy]
strict = true
python_version = "3.14"
namespace_packages = true
explicit_package_bases = true
files = ["custom_components/local_delta"]
