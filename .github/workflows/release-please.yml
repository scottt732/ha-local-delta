name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A PR opened with the built-in GITHUB_TOKEN triggers no workflows, so the release
      # PR would sit behind the required checks forever. RELEASE_PLEASE_TOKEN is a
      # fine-grained PAT (contents + pull requests: read/write) whose PRs run CI like
      # anyone else's; without it the job still runs, but the release PR gets no checks.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A release made with GITHUB_TOKEN fires no "release" workflow, so the HACS
      # zip is built here rather than in a separate release-triggered workflow.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
      - name: Attach local_delta.zip
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          cd custom_components/local_delta
          zip -r -q -X "${GITHUB_WORKSPACE}/local_delta.zip" . \
            -x '*__pycache__*' -x '*.pyc' -x 'AGENTS.md' -x 'CLAUDE.md'
          cd "${GITHUB_WORKSPACE}"
          gh release upload "$TAG" local_delta.zip --clobber
