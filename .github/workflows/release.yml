name: release

# Manual fallback; release-please.yml attaches the zip on normal releases.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.2.0
        required: true

permissions:
  contents: read

jobs:
  hacs-zip:
    name: attach local_delta.zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Check the version against the tag
        run: |
          expected="${TAG#v}"
          actual="$(jq -r '.version' custom_components/local_delta/manifest.json)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::tag ${TAG} expects manifest version ${expected}, found ${actual}"
            exit 1
          fi

      - name: Build local_delta.zip
        run: |
          cd custom_components/local_delta
          zip -r -q -X "${GITHUB_WORKSPACE}/local_delta.zip" . \
            -x '*__pycache__*' -x '*.pyc' -x 'AGENTS.md' -x 'CLAUDE.md'
          unzip -l "${GITHUB_WORKSPACE}/local_delta.zip" | head -20

      - name: Attach it to the release
        run: gh release upload "$TAG" local_delta.zip --clobber
